[workspace]
resolver = "2"
members = ["crates/core", "crates/color", "crates/io", "crates/project", "crates/engine", "crates/cli", "crates/ocio"]
exclude = ["vendor/ocio-rs", "vendor/ocio-sys"]

[patch.crates-io]
ocio-rs = { path = "vendor/ocio-rs" }
ocio-sys = { path = "vendor/ocio-sys" }

[workspace.package]
version = "0.2.4"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
rayon = "1.11"
blake3 = "1.8"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "exr", "hdr", "webp", "bmp"] }
clap = { version = "4.6", features = ["derive"] }
tempfile = "3.23"
fs2 = "0.4"
tinge-core = { path = "crates/core" }
tinge-color = { path = "crates/color" }
tinge-io = { path = "crates/io" }
tinge-project = { path = "crates/project" }
tinge-engine = { path = "crates/engine" }
tinge-ocio = { path = "crates/ocio" }

[profile.release]
lto = "thin"
strip = true
