httparse = "1.10.1"
getrandom = "0.4.3"
fs2.workspace = true
tempfile.workspace = true
tinge-core.workspace = true
tinge-color.workspace = true
tinge-io.workspace = true
tinge-project.workspace = true
tinge-engine.workspace = true
tinge-ocio.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Storage_FileSystem"] }

