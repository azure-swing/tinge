name: Rust
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Agent protocol acceptance
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { 'target/release/vibecolor.exe' } else { 'target/release/vibecolor' }
          python scripts/plugin-acceptance.py --executable $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/agent-acceptance.py --executable $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node --test scripts/viewer-client.test.cjs
